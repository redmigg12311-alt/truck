<style>
:root{
  --cream:#fff7e7;
  --gold:#ffc400;
  --gold2:#ff9f1c;
  --green:#35df83;
  --ink:#11151a;
  --glass:rgba(16,20,25,.56);
  --glass-soft:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.18);
  --muted:rgba(255,247,231,.62);
  --shadow:0 24px 80px rgba(0,0,0,.48);
  --truck-thumb:url("https://raw.githubusercontent.com/redmigg12311-alt/truck/refs/heads/main/1.avif");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  min-height:100svh;
  overflow:hidden;
  color:var(--cream);
  font-family:Inter,Mukta,sans-serif;
  background:
    linear-gradient(180deg,rgba(5,10,14,.10) 0%,rgba(5,8,12,.16) 45%,rgba(5,8,12,.58) 100%),
    url("https://i.ibb.co/S7t9NmW0/truck.webp") center center/cover no-repeat fixed;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(circle at 50% 45%,transparent 18%,rgba(0,0,0,.13) 72%,rgba(0,0,0,.32) 100%),
    linear-gradient(90deg,rgba(0,0,0,.14),transparent 28%,transparent 72%,rgba(0,0,0,.14));
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{
  outline:2px solid var(--gold);outline-offset:3px
}
a{color:inherit}

/* ---------- material symbols ---------- */
.material-symbols-rounded{
  font-family:'Material Symbols Rounded';
  font-weight:normal;font-style:normal;
  font-size:20px;line-height:1;letter-spacing:normal;
  text-transform:none;display:inline-block;white-space:nowrap;
  word-wrap:normal;direction:ltr;
  font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
  font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
}

.play .material-symbols-rounded{
  font-size:19px;
  font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;
}

.control .material-symbols-rounded{
  font-size:19px;
}

.round-btn .material-symbols-rounded{
  font-size:17px;
}

.round-btn.active .material-symbols-rounded{
  font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;
}

.close-btn .material-symbols-rounded{
  font-size:20px;
}

.topbar{
  position:fixed;z-index:20;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 26px;
}
.live-clock{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;text-shadow:0 2px 8px #000}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.spotify-link{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border:1px solid var(--line);border-radius:999px;
  text-decoration:none;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(16px) saturate(130%);
  -webkit-backdrop-filter:blur(16px) saturate(130%);
  transition:.2s ease;
  white-space:nowrap;
}
.spotify-link:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}

.hero{
  position:relative;z-index:2;
  height:100svh;display:flex;align-items:flex-start;justify-content:center;
  text-align:center;padding:11vh 18px 150px;
  pointer-events:none;
}
.hero-inner{max-width:1000px}
.hero h1{
  font-family:"Yatra One",cursive;
  font-size:clamp(58px,9.5vw,132px);
  line-height:.98;color:var(--cream);
  text-shadow:4px 4px 0 #d62828,8px 8px 0 rgba(0,0,0,.35);
}
.hero-sub{
  display:inline-flex;align-items:center;justify-content:center;
  margin-top:18px;max-width:min(860px,calc(100vw - 34px));
  padding:9px 18px;border-radius:999px;
  color:#fff9ec;font-size:clamp(13px,1.5vw,18px);font-weight:700;
  line-height:1.25;text-shadow:0 2px 9px #000;
  background:rgba(10,14,18,.46);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 12px 34px rgba(0,0,0,.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.truck-marquee{
  width:min(940px,calc(100vw - 34px));
  margin:10px auto 0;overflow:hidden;white-space:nowrap;
  padding:7px 15px;border-radius:999px;
  color:#ffd75b;font-size:12px;font-weight:800;letter-spacing:.08em;
  text-shadow:0 2px 8px #000;
  background:rgba(9,13,17,.42);
  border:1px solid rgba(255,195,0,.25);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.truck-marquee span{display:inline-block;transition:opacity .2s ease}

/* ---------- compact player bar ---------- */
.player{
  position:fixed;z-index:30;
  left:50%;bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(600px,calc(100vw - 24px));
  padding:9px 10px 10px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:17px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.035)),
    var(--glass);
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.17);
  backdrop-filter:blur(28px) saturate(140%);
  -webkit-backdrop-filter:blur(28px) saturate(140%);
}
.player::after{
  content:"";position:absolute;inset:0;border-radius:17px;pointer-events:none;
  background:linear-gradient(105deg,rgba(255,255,255,.08),transparent 38%,rgba(255,178,61,.06));
}
.player-row{
  position:relative;
  z-index:1;display:flex;align-items:center;gap:9px;
}
.cover{
  width:44px;height:44px;flex:0 0 44px;object-fit:cover;
  border-radius:10px;background:#272b2f;
  border:1px solid rgba(255,255,255,.24);
  box-shadow:0 6px 16px rgba(0,0,0,.35);
}
.player.playing .cover{animation:coverPulse 1.7s ease-in-out infinite}
@keyframes coverPulse{50%{transform:scale(1.025)}}
.track-info{min-width:0;flex:1}
.status{
  display:flex;align-items:center;gap:6px;
  color:rgba(255,247,231,.58);font-size:8.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;margin-bottom:1px;
}
.status i{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.status.error i{background:#ff5c5c;box-shadow:0 0 8px #ff5c5c}
.song{
  color:#fff9ed;font-size:13.5px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.artist{
  margin-top:1px;color:rgba(255,247,231,.58);
  font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-actions{display:flex;align-items:center;gap:3px}
.round-btn{
  width:29px;height:29px;border-radius:50%;
  border:1px solid rgba(255,255,255,.17);
  color:var(--cream);background:rgba(255,255,255,.07);
  display:grid;place-items:center;transition:.18s;flex:0 0 auto;
}
.round-btn:hover{background:rgba(255,255,255,.15)}
.round-btn.active{color:var(--gold);border-color:rgba(255,195,0,.55);background:rgba(255,195,0,.08)}

/* volume control, YouTube style: hover/focus reveals the slider */
.volume-wrap{
  display:flex;align-items:center;
  padding:0 2px;border-radius:999px;
}
.vol-slider{
  width:0;opacity:0;height:3px;margin-left:0;
  appearance:none;-webkit-appearance:none;
  border-radius:999px;background:rgba(255,255,255,.25);cursor:pointer;
  transition:width .2s ease,opacity .2s ease,margin-left .2s ease;
}
.volume-wrap:hover .vol-slider,
.volume-wrap:focus-within .vol-slider{
  width:58px;opacity:1;margin-left:6px;
}
.vol-slider::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;width:9px;height:9px;
  border-radius:50%;background:#fff7e7;box-shadow:0 2px 6px #000;
}
.vol-slider::-moz-range-thumb{
  width:9px;height:9px;border:0;border-radius:50%;background:#fff7e7;
}
@media(hover:none){
  .vol-slider{width:46px;opacity:1;margin-left:6px}
}

/* ---------- smooth truck progress road ---------- */
.progress{
  position:relative;
  z-index:1;
  margin:9px 3px 0;
}

.road-progress{
  --progress:0%;
  position:relative;
  width:100%;
  height:38px;
  display:flex;
  align-items:center;
  cursor:pointer;
  touch-action:none;
}

.road-progress.seeking .truck-runner img{
  transform:scale(1.06);
  filter:
    drop-shadow(0 4px 6px rgba(0,0,0,.75))
    drop-shadow(0 0 8px rgba(255,195,0,.28));
}

.road-line{
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:9px;
  transform:translateY(-50%);
  border-radius:8px;
  background:
    linear-gradient(180deg,#464a4d 0%,#222528 48%,#111315 100%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.55),
    0 1px 2px rgba(0,0,0,.4);
}

.road-line::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:2px;
  transform:translateY(-50%);
  background:
    repeating-linear-gradient(
      to right,
      #ffe9a8 0 8px,
      transparent 8px 18px
    );
  opacity:.9;
}

.progress-fill{
  position:absolute;
  left:0;
  top:50%;
  width:var(--progress);
  height:5px;
  transform:translateY(-50%);
  border-radius:10px;
  background:linear-gradient(90deg,#ff9f1c,#ffc400);
  box-shadow:0 0 8px rgba(255,195,0,.35);
  pointer-events:none;
  z-index:2;
}

.road-glow{
  position:absolute;
  left:0;
  top:50%;
  width:var(--progress);
  height:14px;
  transform:translateY(-50%);
  border-radius:20px;
  background:rgba(255,195,0,.15);
  filter:blur(7px);
  pointer-events:none;
  z-index:1;
}

.seek{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  opacity:0;
  pointer-events:none;
  appearance:none;
  -webkit-appearance:none;
  background:transparent;
  z-index:1;
}

.road-progress:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:4px;
  border-radius:8px;
}

.truck-runner{
  position:absolute;
  left:var(--progress);
  top:50%;
  width:54px;
  height:38px;
  transform:translate3d(-50%,-50%,0);
  pointer-events:none;
  z-index:6;
  will-change:left;
  transition:none;
}

.truck-runner img{
  width:54px;
  height:38px;
  display:block;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  filter:
    drop-shadow(0 3px 4px rgba(0,0,0,.7))
    drop-shadow(0 0 5px rgba(255,195,0,.18));
  transform-origin:center center;
  will-change:transform;
}

.player.playing .truck-runner img{
  animation:truckBounce .45s ease-in-out infinite alternate;
}

@keyframes truckBounce{
  from{transform:translateY(0)}
  to{transform:translateY(-1px)}
}

@media(min-width:721px){
  .truck-runner{width:58px;height:40px}
  .truck-runner img{width:58px;height:40px}
}

@media(max-width:720px){
  .road-progress{height:34px}
  .truck-runner{width:46px;height:32px}
  .truck-runner img{width:46px;height:32px}
}

@media(max-width:430px){
  .road-progress{height:32px}
  .truck-runner{width:42px;height:29px}
  .truck-runner img{width:42px;height:29px}
}

.time-row{
  display:flex;justify-content:space-between;margin-top:3px;
  color:rgba(255,247,231,.48);font-size:8.5px;
}
.controls{
  position:relative;
  z-index:1;
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:2px;
}
.control{
  width:29px;height:29px;border:0;border-radius:50%;
  display:grid;place-items:center;background:transparent;
  color:var(--cream);
}
.control:hover{background:rgba(255,255,255,.08)}
.play{
  width:38px;height:38px;border:0;border-radius:50%;
  display:grid;place-items:center;
  background:var(--gold);color:#171717;
  box-shadow:0 6px 16px rgba(0,0,0,.28);
  transition:.18s;
}
.play:hover{transform:scale(1.05)}


.drawer-backdrop{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.38);
  opacity:0;pointer-events:none;transition:.25s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;z-index:60;top:14px;right:14px;bottom:14px;
  width:min(430px,calc(100vw - 28px));
  display:flex;flex-direction:column;overflow:hidden;
  border:1px solid rgba(255,255,255,.22);border-radius:24px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.035)),
    rgba(13,17,21,.78);
  box-shadow:0 30px 100px rgba(0,0,0,.58);
  backdrop-filter:blur(30px) saturate(135%);
  -webkit-backdrop-filter:blur(30px) saturate(135%);
  transform:translateX(calc(100% + 30px));transition:.3s ease;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:18px 18px 12px;
}
.drawer-title{font-size:19px;font-weight:800}
.drawer-sub{font-size:11px;color:var(--muted);margin-top:2px}
.close-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);color:var(--cream);
  background:rgba(255,255,255,.07);display:grid;place-items:center;
  flex:0 0 auto;
}

.drawer-tabs{
  display:flex;gap:6px;padding:0 14px 10px;
}
.drawer-tab{
  flex:1;padding:8px 10px;border-radius:10px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.05);color:rgba(255,247,231,.7);
  font-size:11.5px;font-weight:800;letter-spacing:.02em;
  transition:.16s;text-align:center;
}
.drawer-tab:hover{background:rgba(255,255,255,.09)}
.drawer-tab.active{
  background:rgba(255,195,0,.14);color:var(--gold);
  border-color:rgba(255,195,0,.4);
}

.add-link-wrap{
  display:flex;gap:8px;padding:0 14px 10px;
}
.add-link-input{
  flex:1;min-width:0;height:38px;padding:0 13px;
  color:var(--cream);border:1px solid rgba(255,255,255,.13);
  border-radius:12px;outline:none;background:rgba(255,255,255,.06);
}
.add-link-input::placeholder{color:rgba(255,255,255,.38)}
.add-link-btn{
  width:38px;height:38px;flex:0 0 auto;border-radius:12px;
  border:1px solid rgba(255,195,0,.4);background:rgba(255,195,0,.14);
  color:var(--gold);display:grid;place-items:center;transition:.16s;
}
.add-link-btn:hover{background:rgba(255,195,0,.22)}
.add-link-btn:disabled{opacity:.55;cursor:default}
.add-link-btn.busy .material-symbols-rounded{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.search-wrap{padding:0 14px 10px}
.search{
  width:100%;height:38px;padding:0 13px;
  color:var(--cream);border:1px solid rgba(255,255,255,.13);
  border-radius:12px;outline:none;background:rgba(255,255,255,.06);
}
.search::placeholder{color:rgba(255,255,255,.38)}
.track-list{
  flex:1;min-height:0;overflow:auto;padding:0 10px 12px;
  scrollbar-width:thin;
}
.track-list::-webkit-scrollbar{width:6px}
.track-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px}
.track-item{
  width:100%;display:flex;align-items:center;gap:8px;
  padding:8px;border:1px solid transparent;border-radius:13px;
  color:var(--cream);text-align:left;background:transparent;
  transition:.16s;cursor:pointer;
}
.track-item:hover{background:rgba(255,255,255,.07)}
.track-item.active{background:rgba(255,195,0,.09);border-color:rgba(255,195,0,.28)}
.track-item img{
  width:46px;height:46px;flex:0 0 46px;object-fit:cover;border-radius:9px;
  background:#222;
}
.track-copy{min-width:0;flex:1}
.track-name{
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:12px;font-weight:800;
}
.track-artist{
  display:block;margin-top:2px;color:rgba(255,247,231,.52);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;
}
.track-duration{color:rgba(255,247,231,.42);font-size:9px;flex:0 0 auto}
.queued-badge{
  flex:0 0 auto;font-size:8px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--gold);
  background:rgba(255,195,0,.12);border:1px solid rgba(255,195,0,.3);
  padding:2px 6px;border-radius:999px;
}
.track-remove{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
  color:rgba(255,247,231,.62);display:grid;place-items:center;
  transition:.16s;
}
.track-remove:hover{background:rgba(255,92,92,.16);border-color:rgba(255,92,92,.4);color:#ff8a8a}
.track-remove .material-symbols-rounded{font-size:14px}

.drawer-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 15px;border-top:1px solid rgba(255,255,255,.09);
  color:rgba(255,247,231,.45);font-size:9px;
}
.open-spotify{
  color:var(--cream);text-decoration:none;white-space:nowrap;
  font-weight:800;
}
.text-btn{
  color:var(--cream);background:transparent;border:0;
  text-decoration:underline;font-weight:800;font-size:9px;
  cursor:pointer;white-space:nowrap;
}

.toast{
  position:fixed;z-index:120;left:50%;bottom:120px;
  transform:translate(-50%,10px);opacity:0;pointer-events:none;
  max-width:min(520px,calc(100vw - 28px));
  padding:10px 14px;border-radius:12px;
  background:rgba(12,16,20,.9);border:1px solid rgba(255,255,255,.15);
  color:var(--cream);font-size:11px;text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  transition:.22s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- large / ultra-wide desktop ---------- */
@media(min-width:1440px){
  .hero{padding-top:12vh}
  .player{width:min(660px,calc(100vw - 24px))}
}
@media(min-width:1920px){
  .hero-inner{max-width:1120px}
}

/* ---------- laptop / small desktop ---------- */
@media(max-width:1024px){
  .hero{padding-top:9vh}
}

@media(max-width:720px){
  body{background-attachment:scroll}
  .topbar{padding:14px 16px}
  .hero{padding-top:9vh}
  .hero h1{font-size:clamp(50px,15vw,86px)}
  .hero-sub{font-size:12px;margin-top:13px;padding:8px 12px}
  .truck-marquee{font-size:10px;margin-top:7px}

/* =========================================================

   Playback is driven entirely by our own queue (an array of

   ========================================================= */

const PLAYLIST_ID = "PLgObA3pAqvOh87Z03QG8Z4xE-uqlAWSBy";

const HISTORY_KEY = "hop_history_v1";

let playPos = 0;          // position within playOrder

function fmt(seconds){
  seconds = Math.max(0, Math.floor(Number(seconds) || 0));
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2,"0")}`;
}

function toast(message){
  $("toast").textContent = message;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 3000);
}

function updateClock(){
  $("clock").textContent = new Date().toLocaleTimeString("en-IN", {
    hour:"numeric",

  }).toLowerCase();

  const icon = $("volumeIcon");
  const volume = playerReady && player ? player.getVolume() : Number($("volumeSlider").value);

  if(isMuted || volume === 0) icon.textContent = "volume_off";
  else if(volume < 50) icon.textContent = "volume_down";
  else icon.textContent = "volume_up";
}

function setVisualProgress(progress){
  const clamped = Math.max(0, Math.min(1, Number(progress) || 0));
  const percent = `${clamped * 100}%`;
  const road = $("roadProgress");
  const truck = $("truckRunner");

  road.style.setProperty("--progress", percent);
  $("progressFill").style.width = percent;

  const roadWidth = road.clientWidth;
  const truckWidth = truck.offsetWidth;

  if(roadWidth > 0){
    const half = truckWidth / 2;
    const center = Math.max(half, Math.min(roadWidth - half, clamped * roadWidth));
    truck.style.left = `${center}px`;
  }

  $("seek").value = Math.round(clamped * 1000);
}

function openPlaylist(){
  $("drawer").classList.add("open");
  $("drawerBackdrop").classList.add("open");

}

  $("drawerBackdrop").classList.remove("open");
  $("drawer").setAttribute("aria-hidden","true");

/* ---------------------------------------------------------
   Drawer tabs
   --------------------------------------------------------- */

function setDrawerTab(tab){
  activeDrawerTab = tab;

  $("tabQueue").classList.toggle("active", tab === "queue");
  $("tabQueue").setAttribute("aria-selected", tab === "queue" ? "true" : "false");
  $("tabHistory").classList.toggle("active", tab === "history");
  $("tabHistory").setAttribute("aria-selected", tab === "history" ? "true" : "false");

  $("addLinkWrap").hidden = tab !== "queue";
  $("searchWrap").hidden = tab !== "queue";
  $("trackList").hidden = tab !== "queue";
  $("historyList").hidden = tab !== "history";
  $("openPlaylistLink").hidden = tab !== "queue";
  $("drawerFootLabel").hidden = tab !== "queue";
  $("clearHistoryBtn").hidden = tab !== "history" || !history.length;

  if(tab === "history") renderHistory();
}

$("tabQueue").onclick = () => setDrawerTab("queue");
$("tabHistory").onclick = () => setDrawerTab("history");

/* ---------------------------------------------------------
   Queue helpers (ID-based)
   --------------------------------------------------------- */

function thumbnail(videoId){
  return `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
}

function cleanArtistName(name){
  return String(name || "")
    .replace(/\s*-\s*Topic\s*$/i, "")
    .replace(/\s*-\s*Topics\s*$/i, "")
    .trim() || "YouTube";
}

function cleanSongTitle(name){
  return String(name || "").replace(/\s+/g, " ").trim();
}

function itemById(id){
  return playlistItems.find(item => item.id === id);
}

function buildSequentialOrder(){
  return playlistItems.map(item => item.id);
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function syncPlayPos(){
  const pos = playOrder.indexOf(currentVideoId);
  if(pos >= 0) playPos = pos;
}

function addVideosToQueue(ids){
  const existingIds = new Set(playlistItems.map(item => item.id));
  const newIds = [];

  ids.forEach(id => {
    if(!id || existingIds.has(id)) return;
    playlistItems.push({ id, title:"", artist:"", duration:0, source:"user" });
    newIds.push(id);
    existingIds.add(id);
  });

  if(newIds.length){
    const insertAt = Math.min(playPos + 1, playOrder.length);
    playOrder.splice(insertAt, 0, ...newIds);

    renderPlaylist($("trackSearch").value);
    $("playlistMeta").textContent = `${playlistItems.length} songs • YouTube playlist`;
    startMetadataScanner();
  }

  return newIds.length;
}

function removeQueueItem(id){
  const item = itemById(id);
  if(!item || item.source !== "user") return;

  const wasCurrent = id === currentVideoId;

  playlistItems = playlistItems.filter(i => i.id !== id);
  playOrder = playOrder.filter(vid => vid !== id);

  if(wasCurrent && playOrder.length){
    const pos = Math.min(playPos, playOrder.length - 1);
    loadTrackById(playOrder[pos], { autoplay:true });
  }else{
    syncPlayPos();
  }

  renderPlaylist($("trackSearch").value);
  $("playlistMeta").textContent = `${playlistItems.length} songs • YouTube playlist`;
  toast("Removed from queue");
}

/* ---------------------------------------------------------
   Rendering
   --------------------------------------------------------- */

function renderPlaylist(filter = ""){
  const list = $("trackList");
  if(!list) return;

  const q = String(filter).toLowerCase().trim();
  list.innerHTML = "";

  const filtered = playlistItems.filter(item => {
    const text = `${item.title || ""} ${cleanArtistName(item.artist)} ${item.id}`.toLowerCase();
    return !q || text.includes(q);
  });

  if(!filtered.length){
    list.innerHTML = playlistItems.length
      ? '<div style="padding:18px;color:rgba(255,255,255,.5);font-size:12px">No matching songs.</div>'
      : '<div style="padding:18px;color:rgba(255,255,255,.6);font-size:12px">Loading YouTube playlist…</div>';
    return;
  }

  filtered.forEach(item => {
    const row = document.createElement("div");
    row.className = "track-item" + (item.id === currentVideoId ? " active" : "");
    row.setAttribute("role","button");
    row.tabIndex = 0;

    const title = item.title || "Loading…";
    const artist = cleanArtistName(item.artist);
    const duration = item.duration > 0 ? fmt(item.duration) : "—:——";

    row.innerHTML = `
      <img alt="">
      <span class="track-copy">
        <span class="track-name"></span>
        <span class="track-artist"></span>
      </span>
      ${item.source === "user" ? '<span class="queued-badge">Added</span>' : ""}
      <span class="track-duration"></span>
      ${item.source === "user" ? '<button type="button" class="track-remove" aria-label="Remove from queue"><span class="material-symbols-rounded">close</span></button>' : ""}
    `;

    const img = row.querySelector("img");
    img.src = thumbnail(item.id);
    img.onerror = () => img.src = fallbackCover;

    row.querySelector(".track-name").textContent = title;
    row.querySelector(".track-artist").textContent = artist;
    row.querySelector(".track-duration").textContent = duration;

    row.addEventListener("click", () => playTrackById(item.id));
    row.addEventListener("keydown", event => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        playTrackById(item.id);
      }
    });

    const removeBtn = row.querySelector(".track-remove");
    if(removeBtn){
      removeBtn.addEventListener("click", event => {
        event.stopPropagation();
        removeQueueItem(item.id);
      });
    }

    list.appendChild(row);
  });

  $("playlistMeta").textContent = `${playlistItems.length} songs • YouTube playlist`;
}

function relTime(ts){
  const diff = Date.now() - ts;
  const mins = Math.round(diff / 60000);
  if(mins < 1) return "just now";
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs / 24);
  if(days < 7) return `${days}d ago`;
  return new Date(ts).toLocaleDateString();
}

function renderHistory(){
  const list = $("historyList");
  if(!list) return;

  list.innerHTML = "";

  if(!history.length){
    list.innerHTML = '<div style="padding:18px;color:rgba(255,255,255,.5);font-size:12px">No songs played yet.</div>';
    $("clearHistoryBtn").hidden = true;
    return;
  }

  $("clearHistoryBtn").hidden = false;

  history.forEach(entry => {
    const row = document.createElement("div");
    row.className = "track-item";
    row.setAttribute("role","button");
    row.tabIndex = 0;

    row.innerHTML = `
      <img alt="">
      <span class="track-copy">
        <span class="track-name"></span>
        <span class="track-artist"></span>
      </span>
      <span class="track-duration"></span>
    `;

    const img = row.querySelector("img");
    img.src = thumbnail(entry.id);
    img.onerror = () => img.src = fallbackCover;

    row.querySelector(".track-name").textContent = entry.title;
    row.querySelector(".track-artist").textContent = entry.artist;
    row.querySelector(".track-duration").textContent = relTime(entry.playedAt);

    row.addEventListener("click", () => playFromHistory(entry));
    row.addEventListener("keydown", event => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        playFromHistory(entry);
      }
    });

    list.appendChild(row);
  });
}

/* ---------------------------------------------------------
   History persistence
   --------------------------------------------------------- */

function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    history = Array.isArray(parsed) ? parsed : [];
  }catch{
    history = [];
  }
}

function saveHistory(){
  try{
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, HISTORY_LIMIT)));
  }catch{
    // Storage unavailable (private browsing, or an embedded preview
    // sandbox) — history still works for the current session, it just
    // won't be remembered on next visit. Works normally once hosted.
  }
}

function logHistoryFromPlayer(){
  if(!playerReady || !player) return;

  const data = player.getVideoData ? player.getVideoData() : {};
  const videoId = data.video_id;
  if(!videoId || videoId === lastLoggedVideoId) return;

  lastLoggedVideoId = videoId;

  const item = itemById(videoId);
  const title = cleanSongTitle(data.title) || item?.title || "Unknown track";
  const artist = cleanArtistName(data.author || item?.artist);

  history = history.filter(entry => entry.id !== videoId);
  history.unshift({ id: videoId, title, artist, playedAt: Date.now() });
  history = history.slice(0, HISTORY_LIMIT);

  saveHistory();

  if(activeDrawerTab === "history" && $("drawer").classList.contains("open")){
    renderHistory();
  }
}

function playFromHistory(entry){
  let item = itemById(entry.id);

  if(!item){
    addVideosToQueue([entry.id]);
    item = itemById(entry.id);
    if(item){
      item.title = entry.title;
      item.artist = entry.artist;
    }
  }

  if(item){
    loadTrackById(item.id, { autoplay:true });
    closePlaylist();
  }
}

$("clearHistoryBtn").onclick = () => {
  history = [];
  saveHistory();
  renderHistory();
  toast("History cleared");
};

/* ---------------------------------------------------------
   Playback (queue-driven)
   --------------------------------------------------------- */

function loadTrackById(id, { autoplay = true } = {}){
  if(!playerReady || !player) return;

  const item = itemById(id);
  if(!item) return;

  currentVideoId = id;
  syncPlayPos();

  try{
    if(autoplay) player.loadVideoById(item.id);
    else player.cueVideoById(item.id);
  }catch(error){
    console.error("Failed to load video", id, error);
    toast("Unable to play that song.");
    return;
  }

  $("cover").src = thumbnail(item.id);
  $("cover").onerror = () => $("cover").src = fallbackCover;
  $("song").textContent = item.title || "Loading…";
  $("artist").textContent = cleanArtistName(item.artist);

  renderPlaylist($("trackSearch").value);
}

function playTrackById(id){
  if(!playerReady || !player || !playlistItems.length){
    toast("Playlist is still loading…");
    return;
  }

  loadTrackById(id, { autoplay:true });
  closePlaylist();
}

function nextTrack(){
  if(!playOrder.length) return;
  const pos = (playPos + 1) % playOrder.length;
  loadTrackById(playOrder[pos], { autoplay:true });
}

function previousTrack(){
  if(!playerReady || !player) return;

  const current = player.getCurrentTime() || 0;

  if(current > 3){
    player.seekTo(0, true);
    return;
  }

  if(!playOrder.length) return;
  const pos = (playPos - 1 + playOrder.length) % playOrder.length;
  loadTrackById(playOrder[pos], { autoplay:true });
}

function applyShuffle(enable){
  shuffle = enable;
  $("shuffle").classList.toggle("active", shuffle);

  playOrder = shuffle ? shuffleArray(buildSequentialOrder()) : buildSequentialOrder();

  if(currentVideoId){
    const pos = playOrder.indexOf(currentVideoId);
    if(pos > 0){
      playOrder.splice(pos, 1);
      playOrder.unshift(currentVideoId);
    }
  }

  playPos = 0;
  toast(shuffle ? "Shuffle on" : "Shuffle off");
}

function updateCurrentTrack(){
  if(!playerReady || !player) return;

  const data = player.getVideoData ? player.getVideoData() : {};
  const videoId = data.video_id || currentVideoId;
  if(!videoId) return;

  currentVideoId = videoId;
  syncPlayPos();

  let item = itemById(videoId);

  // Safety net: register anything unexpectedly playing so the UI
  // and queue stay consistent.
  if(!item){
    playlistItems.push({ id: videoId, title:"", artist:"", duration:0, source:"user" });
    item = playlistItems[playlistItems.length - 1];
    if(!playOrder.includes(videoId)) playOrder.push(videoId);
    syncPlayPos();
  }

  const liveTitle = cleanSongTitle(data.title);
  const liveArtist = data.author;
  if(liveTitle && !item.title) item.title = liveTitle;
  if(liveArtist && !item.artist) item.artist = cleanArtistName(liveArtist);

  $("cover").src = thumbnail(item.id);
  $("cover").onerror = () => $("cover").src = fallbackCover;
  $("song").textContent = data.title || item.title || "Indian Truck Driver Music";
  $("artist").textContent = cleanArtistName(data.author || item.artist || "YouTube");

  if(playlistItems.length) renderPlaylist($("trackSearch").value);
}

/* ---------------------------------------------------------
   Main YouTube player
   --------------------------------------------------------- */

function createYouTubePlayer(){
  player = new YT.Player("youtubePlayer", {
    width: "1",
    height: "1",

    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      iv_load_policy: 3,
      modestbranding: 1,
      playsinline: 1,
      rel: 0,
      enablejsapi: 1,
      origin: window.location.origin
    },

    events: {
      onReady: onYouTubeReady,
      onStateChange: onYouTubeStateChange,
      onError: onYouTubeError
    }
  });
}

function onYouTubeReady(){
  playerReady = true;
  player.setVolume(Number($("volumeSlider").value));
  setStatus("LOADING PLAYLIST");
  bootstrapOriginalPlaylist();
}

async function bootstrapOriginalPlaylist(){
  try{
    const ids = await resolvePlaylistIds(PLAYLIST_ID);

    if(!ids.length){
      setStatus("PLAYLIST ERROR", true);
      $("trackList").innerHTML =
        '<div style="padding:18px;color:rgba(255,255,255,.6);font-size:12px">YouTube playlist could not be loaded. Please refresh the page.</div>';
      return;
    }

    playlistItems = ids.map(id => ({ id, title:"", artist:"", duration:0, source:"native" }));
    playOrder = buildSequentialOrder();

    const startId = ids.includes(START_VIDEO_ID) ? START_VIDEO_ID : ids[0];
    loadTrackById(startId, { autoplay:false });

    $("playlistMeta").textContent = `${playlistItems.length} songs • YouTube playlist`;
    setStatus("PLAYLIST READY");

    startMetadataScanner();
  }catch(error){
    console.error("Playlist bootstrap failed:", error);
    setStatus("PLAYLIST ERROR", true);
    $("trackList").innerHTML =
      '<div style="padding:18px;color:rgba(255,255,255,.6);font-size:12px">YouTube playlist could not be loaded. Please refresh the page.</div>';
  }
}

function onYouTubeStateChange(event){
  switch(event.data){
    case YT.PlayerState.UNSTARTED:
      setStatus("READY");
      break;

    case YT.PlayerState.PLAYING:
      setPlaying(true);
      updateCurrentTrack();
      logHistoryFromPlayer();
      startProgressLoop();
      break;

    case YT.PlayerState.PAUSED:
      setPlaying(false);
      stopProgressLoop();
      break;

    case YT.PlayerState.ENDED:
      // We own the queue, so we decide what plays next.
      setPlaying(false);
      stopProgressLoop();
      nextTrack();
      break;

    case YT.PlayerState.BUFFERING:
      setStatus("BUFFERING");
      break;

    case YT.PlayerState.CUED:
      setStatus("PLAYLIST READY");
      break;
  }
}

function onYouTubeError(event){
  setPlaying(false);
  setStatus("YOUTUBE ERROR", true);

  const messages = {
    2: "Invalid YouTube playlist/video information.",
    5: "This video cannot be played in the HTML5 player.",
    100: "This YouTube video is unavailable or private.",
    101: "This video does not allow embedded playback.",
    150: "This video does not allow embedded playback."
  };

  toast(messages[event.data] || "YouTube could not play this track.");

  // Don't get stuck on a broken video — skip ahead automatically
  // if there's more than one track in the queue.
  if(playOrder.length > 1){
    setTimeout(nextTrack, 800);
  }
}

function startProgressLoop(){
  stopProgressLoop();

  progressTimer = setInterval(() => {
    if(!playerReady || !player || !isPlaying) return;

    const current = player.getCurrentTime() || 0;
    const duration = player.getDuration() || 0;

    if(duration > 0){
      setVisualProgress(current / duration);
      $("currentTime").textContent = fmt(current);
      $("duration").textContent = fmt(duration);
    }
  }, 100);
}

function stopProgressLoop(){
  if(progressTimer){
    clearInterval(progressTimer);
    progressTimer = null;
  }
}

function playPause(){
  if(!playerReady || !player){
    toast("YouTube playlist is still loading…");
    return;
  }

  if(isPlaying){
    player.pauseVideo();
  }else{
    player.playVideo();
  }
}

function seekFromPointer(event){
  if(!playerReady || !player) return;

  const duration = player.getDuration() || 0;

  if(!duration){
    toast("The selected YouTube track is still loading.");
    return;
  }

  const road = $("roadProgress");
  const rect = road.getBoundingClientRect();

  if(!rect.width) return;

  const x = Math.max(0, Math.min(rect.width, event.clientX - rect.left));
  const progress = x / rect.width;

  player.seekTo(progress * duration, true);

  setVisualProgress(progress);
  $("currentTime").textContent = fmt(progress * duration);
}

/* ---------------------------------------------------------
   Metadata scanner — fetches real titles/artists/durations
   one video at a time via a second, muted, invisible player.
   getPlaylist() only ever returns bare video IDs, so this is
   the only way to get real names without a YouTube Data API
   key.
   --------------------------------------------------------- */

function createMetadataPlayer(){
  metadataPlayer = new YT.Player("youtubeMetadataPlayer", {
    width: "1",
    height: "1",
    playerVars: {
      autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3,
      modestbranding: 1, playsinline: 1, rel: 0, enablejsapi: 1,
      origin: window.location.origin
    },
    events: {
      onReady: onMetadataReady,
      onStateChange: onMetadataStateChange,
      onError: onMetadataError
    }
  });
}

function onMetadataReady(){
  metadataPlayerReady = true;
  try{ metadataPlayer.mute(); }catch{}
  if(playlistItems.length) startMetadataScanner();
}

function startMetadataScanner(){
  if(metadataScanRunning) return;
  metadataScanRunning = true;
  metadataScanIndex = 0;
  scanNextMetadata();
}

function scanNextMetadata(){
  clearTimeout(metadataScanTimer);

  if(!metadataPlayerReady || !metadataPlayer){
    metadataScanTimer = setTimeout(scanNextMetadata, 300);
    return;
  }

  while(
    metadataScanIndex < playlistItems.length &&
    playlistItems[metadataScanIndex].title
  ){
    metadataScanIndex++;
  }

  if(metadataScanIndex >= playlistItems.length){
    metadataScanRunning = false;
    return;
  }

  const item = playlistItems[metadataScanIndex];

  try{
    metadataPlayer.mute();
    metadataPlayer.cueVideoById(item.id);
  }catch(error){
    console.warn("Metadata cue failed for", item.id, error);
    metadataScanIndex++;
    metadataScanTimer = setTimeout(scanNextMetadata, 60);
  }
}

function onMetadataStateChange(event){
  if(event.data !== YT.PlayerState.CUED && event.data !== YT.PlayerState.UNSTARTED) return;

  const item = playlistItems[metadataScanIndex];
  if(!item) return;

  const data = metadataPlayer.getVideoData ? metadataPlayer.getVideoData() : {};

  if(data && data.video_id === item.id){
    item.title = cleanSongTitle(data.title) || `Track ${metadataScanIndex + 1}`;
    item.artist = cleanArtistName(data.author);
    item.duration = metadataPlayer.getDuration ? (metadataPlayer.getDuration() || 0) : 0;

    renderPlaylist($("trackSearch").value);

    if(item.id === currentVideoId) updateCurrentTrack();

    metadataScanIndex++;
    metadataScanTimer = setTimeout(scanNextMetadata, 90);
  }
}

function onMetadataError(){
  const item = playlistItems[metadataScanIndex];

  if(item){
    item.title = item.title || "Unavailable video";
    item.artist = item.artist || "YouTube";
    renderPlaylist($("trackSearch").value);
  }

  metadataScanIndex++;
  metadataScanTimer = setTimeout(scanNextMetadata, 90);
}

/* ---------------------------------------------------------
   Playlist-link importer — resolves a pasted playlist ID into
   its list of video IDs using a third, muted, invisible player.
   --------------------------------------------------------- */

function createImportPlayer(){
  importPlayer = new YT.Player("youtubeImportPlayer", {
    width: "1",
    height: "1",
    playerVars: {
      autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3,
      modestbranding: 1, playsinline: 1, rel: 0, enablejsapi: 1,
      origin: window.location.origin
    },
    events: {
      onReady: () => {
        importPlayerReady = true;
        try{ importPlayer.mute(); }catch{}
        processImportQueue();
      },
      onError: onImportError
    }
  });
}

function resolvePlaylistIds(playlistId){
  return new Promise(resolve => {
    importQueue.push({ playlistId, resolve });
    processImportQueue();
  });
}

function processImportQueue(){
  if(importBusy || !importPlayerReady || !importPlayer) return;

  const job = importQueue.shift();
  if(!job) return;

  importBusy = true;
  activeImportJob = job;

  try{
    importPlayer.loadPlaylist({ list: job.playlistId, listType:"playlist", index:0 });
  }catch(error){
    console.error("Playlist import failed:", error);
    importBusy = false;
    activeImportJob = null;
    job.resolve([]);
    processImportQueue();
    return;
  }

  let attempts = 0;

  job.pollTimer = setInterval(() => {
    attempts++;

    let ids = [];
    try{ ids = importPlayer.getPlaylist() || []; }catch{}

    if(ids.length){
      clearInterval(job.pollTimer);
      importBusy = false;
      activeImportJob = null;
      job.resolve(ids.filter(Boolean));
      processImportQueue();
    }else if(attempts >= 60){
      clearInterval(job.pollTimer);
      importBusy = false;
      activeImportJob = null;
      job.resolve([]);
      processImportQueue();
    }
  }, 250);
}

function onImportError(){
  if(!activeImportJob) return;

  clearInterval(activeImportJob.pollTimer);
  importBusy = false;
  activeImportJob.resolve([]);
  activeImportJob = null;
  processImportQueue();
}

/* ---------------------------------------------------------
   Parsing pasted YouTube links
   --------------------------------------------------------- */

function parseYouTubeInput(raw){
  const text = String(raw || "").trim();
  if(!text) return null;

  if(/^[a-zA-Z0-9_-]{11}$/.test(text)) return { type:"video", id:text };
  if(/^(PL|UU|OL|RD|LL|FL)[a-zA-Z0-9_-]{10,}$/.test(text)) return { type:"playlist", id:text };

  let url;
  try{ url = new URL(text); }catch{ return null; }

  const host = url.hostname.replace(/^www\./,"").replace(/^m\./,"");
  if(!/(^|\.)youtube\.com$/.test(host) && host !== "youtu.be") return null;

  const listId = url.searchParams.get("list");
  const videoId = url.searchParams.get("v");
  const pathParts = url.pathname.split("/").filter(Boolean);

  if(host === "youtu.be"){
    const shortId = pathParts[0];
    if(shortId && shortId.length === 11) return { type:"video", id:shortId };
  }

  if(pathParts[0] === "playlist" && listId) return { type:"playlist", id:listId };
  if(pathParts[0] === "shorts" && pathParts[1]) return { type:"video", id:pathParts[1] };

  if(videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) return { type:"video", id:videoId };
  if(listId) return { type:"playlist", id:listId };

  return null;
}

function setAddLinkBusy(busy){
  $("addLinkBtn").disabled = busy;
  $("addLinkBtn").classList.toggle("busy", busy);
  $("addLinkIcon").textContent = busy ? "sync" : "add";
}

async function handleAddLink(){
  const raw = $("addLinkInput").value;
  const parsed = parseYouTubeInput(raw);

  if(!parsed){
    toast("Paste a valid YouTube song or playlist link.");
    return;
  }

  $("addLinkInput").value = "";
  setAddLinkBusy(true);

  if(parsed.type === "video"){
    const added = addVideosToQueue([parsed.id]);
    toast(added ? "Added to queue" : "That song is already in the queue");
    setAddLinkBusy(false);
    return;
  }

  try{
    const ids = await resolvePlaylistIds(parsed.id);

    if(!ids.length){
      toast("Couldn't read that playlist. It may be private.");
    }else{
      const added = addVideosToQueue(ids);
      toast(added ? `Added ${added} song${added === 1 ? "" : "s"} to queue` : "Those songs are already in the queue");
    }
  }catch(error){
    console.error(error);
    toast("Couldn't load that playlist.");
  }finally{
    setAddLinkBusy(false);
  }
}

$("addLinkBtn").onclick = handleAddLink;
$("addLinkInput").addEventListener("keydown", event => {
  if(event.key === "Enter"){
    event.preventDefault();
    handleAddLink();
  }
});

/* ---------------------------------------------------------
   Controls
   --------------------------------------------------------- */

$("play").onclick = playPause;
$("next").onclick = nextTrack;
$("prev").onclick = previousTrack;

$("shuffle").onclick = () => applyShuffle(!shuffle);

$("volumeSlider").oninput = event => {
  const value = Number(event.target.value);

  if(playerReady && player){
    player.setVolume(value);

    if(value > 0){
      player.unMute();
      isMuted = false;
    }
  }

  updateVolumeIcon();
};

$("volumeBtn").onclick = () => {
  if(!playerReady || !player) return;

  if(isMuted){
    player.unMute();
    isMuted = false;
  }else{
    player.mute();
    isMuted = true;
  }

  updateVolumeIcon();
};

$("openPlaylistTop").onclick = openPlaylist;
$("closePlaylist").onclick = closePlaylist;
$("drawerBackdrop").onclick = closePlaylist;

$("trackSearch").oninput = event => {
  renderPlaylist(event.target.value);
};

document.addEventListener("keydown", event => {
  if(event.key === "Escape") closePlaylist();

  if(
    event.code === "Space" &&
    document.activeElement.tagName !== "INPUT"
  ){
    event.preventDefault();
    playPause();
  }
});

/* ---------------------------------------------------------
   Road / truck seeking
   --------------------------------------------------------- */

const roadProgress = $("roadProgress");

roadProgress.setAttribute("tabindex","0");
roadProgress.setAttribute("role","slider");
roadProgress.setAttribute("aria-valuemin","0");
roadProgress.setAttribute("aria-valuemax","1000");

roadProgress.addEventListener("pointerdown", event => {
  event.preventDefault();
  roadProgress.classList.add("seeking");
  roadProgress.setPointerCapture?.(event.pointerId);
  seekFromPointer(event);
});

roadProgress.addEventListener("pointermove", event => {
  if(roadProgress.classList.contains("seeking")){
    event.preventDefault();
    seekFromPointer(event);
  }
});

roadProgress.addEventListener("pointerup", event => {
  roadProgress.classList.remove("seeking");
  try{ roadProgress.releasePointerCapture?.(event.pointerId); }catch{}
});

roadProgress.addEventListener("pointercancel", () => {
  roadProgress.classList.remove("seeking");
});

roadProgress.addEventListener("keydown", event => {
  if(!playerReady || !player) return;

  const duration = player.getDuration() || 0;
  if(!duration) return;

  const step = 5;
  let nextTime = player.getCurrentTime() || 0;

  if(event.key === "ArrowRight") nextTime = Math.min(duration, nextTime + step);
  else if(event.key === "ArrowLeft") nextTime = Math.max(0, nextTime - step);
  else if(event.key === "Home") nextTime = 0;
  else if(event.key === "End") nextTime = duration;
  else return;

  event.preventDefault();

  player.seekTo(nextTime, true);
  setVisualProgress(nextTime / duration);
  $("currentTime").textContent = fmt(nextTime);
});

/* ---------------------------------------------------------
   Handle viewport resizes so the truck marker stays aligned.
   --------------------------------------------------------- */

window.addEventListener("resize", () => {
  if(!playerReady || !player) return;

  const duration = player.getDuration() || 0;
  const current = player.getCurrentTime() || 0;

  if(duration > 0) setVisualProgress(current / duration);
});
